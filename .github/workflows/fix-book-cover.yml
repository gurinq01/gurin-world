name: Fix GURiN BOOKS cover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cover:
    if: "!contains(github.event.head_commit.message, 'Fix GURiN BOOKS cover')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline cover with external image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<div class="book-cover">')
          img_start = s.index('<img ', start)
          img_end = s.index('>', img_start) + 1
          old = s[img_start:img_end]
          new = '<img src="site_assets/books/book_uchu-no-cloud_cover_portrait.webp?v=20260907" alt="『宇宙のクラウド』表紙">'
          s = s[:img_start] + new + s[img_end:]
          p.write_text(s, encoding='utf-8')
          print('Replaced:', old[:120])
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix GURiN BOOKS cover" || exit 0
          git push
